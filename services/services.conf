# name | health url | start command
#
# One line per service. The start command is also what the watchdog matches
# against to decide whether the process already exists, so make it specific
# enough to be unambiguous - see the process-counting warnings in
# docs/08-ops.md.
#
# ⚠️ Nothing here names a model. Every lip-sync option has an unresolved
#    licence position (docs/07-licenses.md), so this repo describes the socket
#    and you choose what goes in it.
#
# ⚠️ Never put a bare `uvicorn ...` here. Point at a start script that reads
#    your secret and REFUSES TO START without it - an inference endpoint was
#    exposed to the internet for four minutes because an empty secret turned
#    the auth check into a no-op.

tts     | http://127.0.0.1:7896/health | bash scripts/start-service.sh tts
lipsync | http://127.0.0.1:7894/health | bash scripts/start-service.sh lipsync
